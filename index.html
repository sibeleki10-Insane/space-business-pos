<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co" />
    <title>Space-Business POS</title>
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        background: #111111;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      #preloader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .preloader-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        margin-bottom: 48px;
      }
      .preloader-brand {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 36px;
        font-weight: 800;
        letter-spacing: 2px;
        color: #ffffff;
      }
      .preloader-brand span {
        color: #d97b35;
      }
      .preloader-subtitle {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 5px;
        color: #888888;
        text-transform: uppercase;
      }
      .preloader-product {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 3px;
        color: #d97b35;
        text-transform: uppercase;
        margin-top: 4px;
      }
      .preloader-bar-track {
        width: 200px;
        height: 2px;
        background: #2a2a2a;
        border-radius: 2px;
        overflow: hidden;
      }
      .preloader-bar {
        height: 100%;
        background: #d97b35;
        border-radius: 2px;
        animation: loadBar 1.4s ease-in-out forwards;
      }
      @keyframes loadBar {
        0%   { width: 0%; }
        60%  { width: 75%; }
        100% { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="preloader">
      <div class="preloader-logo">
        <div class="preloader-brand"><span>SPACE</span>CODE</div>
        <div class="preloader-subtitle">Technologies</div>
        <div class="preloader-product">Space-Business POS</div>
      </div>
      <div class="preloader-bar-track">
        <div class="preloader-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
